# Multi-LLM judge configuration for focused_workflow.
# Edit model names according to the models supported by your API provider.

api:
  mode: codex  # codex or chat_completions
  base_url: https://estellecode.com/v1
  env_key: ESTELLE_API_KEY
  timeout_seconds: 180
  temperature: 0.1
  max_tokens: 4096

judges:
  - name: gpt_5_5
    provider: estelle
    model: gpt-5.5
    backend: codex
    enabled: true
  - name: local_qwen2_5_0_5b
    provider: local_hf
    backend: local_hf
    model: Qwen2.5-0.5B-Instruct
    model_path: /data1/huangyuling/.cache/huggingface/hub/models--Qwen--Qwen2.5-0.5B-Instruct/snapshots/7ae557604adf67be50417f59c2c2f167def9a775
    python: /data1/huangyuling/conda_envs/vlm_env/bin/python
    max_new_tokens: 4096
    enabled: true
  - name: claude_candidate
    provider: estelle
    model: claude
    backend: codex
    enabled: false
    note: 当前 ESTELLE_API_KEY 落在 gpt 通道，探测 claude 返回 503；需要 claude 令牌组 key 后再开启。
  - name: claude_max_candidate
    provider: estelle
    model: claude-max
    backend: codex
    enabled: false
    note: 当前 ESTELLE_API_KEY 落在 gpt 通道，探测 claude-max 返回 503；需要 claude-max 令牌组 key 后再开启。

rubric_dimensions:
  - novelty
  - feasibility
  - expected_effectiveness
  - experimental_rigor
  - baseline_grounding
  - mechanism_specificity
  - implementation_readiness
  - overall

agreement_thresholds:
  consistent_std_max: 0.8
  review_needed_std_max: 1.5
