# GPT-only judge configuration through Codex, one idea per request.
# Use this when direct /chat/completions is blocked by Cloudflare and long Codex requests reconnect.

api:
  mode: codex
  base_url: https://estellecode.com/v1
  env_key: ESTELLE_API_KEY
  timeout_seconds: 180
  temperature: 0.1
  max_tokens: 4096
  single_idea_requests: true
  request_sleep_seconds: 1.0

judges:
  - name: gpt_5_5_single
    provider: estelle
    model: gpt-5.5
    backend: codex
    single_idea_requests: true
    request_sleep_seconds: 1.0
    enabled: true

rubric_dimensions:
  - novelty
  - feasibility
  - expected_effectiveness
  - experimental_rigor
  - baseline_grounding
  - mechanism_specificity
  - implementation_readiness
  - overall

agreement_thresholds:
  consistent_std_max: 0.8
  review_needed_std_max: 1.5
