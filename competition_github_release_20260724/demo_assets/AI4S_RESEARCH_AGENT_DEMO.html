<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI4S Research Agent Demo</title>
  <style>
    :root {
      --bg: #eef5ff;
      --panel: rgba(255,255,255,.92);
      --ink: #102033;
      --muted: #64748b;
      --line: #dbe7f6;
      --soft: #f6f9ff;
      --blue: #175cff;
      --blue2: #0ea5e9;
      --green: #0f9f6e;
      --orange: #c47a00;
      --red: #dc2626;
      --shadow: 0 18px 48px rgba(20, 56, 110, .13);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 5%, rgba(23,92,255,.18), transparent 30%),
        radial-gradient(circle at 88% 2%, rgba(14,165,233,.18), transparent 30%),
        linear-gradient(180deg, var(--bg), #ffffff 46%, #f8fbff);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .app-shell {
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 5%, rgba(23,92,255,.12), transparent 30%),
        radial-gradient(circle at 88% 2%, rgba(14,165,233,.12), transparent 30%),
        linear-gradient(180deg, rgba(238,245,255,.92), #fff 54%, #f8fbff);
      box-shadow: 0 0 0 1px rgba(219,231,246,.85), 0 28px 90px rgba(20,56,110,.15);
    }
    .top-nav {
      height: 70px;
      flex: 0 0 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid rgba(219,231,246,.80);
      background: rgba(255,255,255,.76);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      box-shadow: 0 12px 28px rgba(23,92,255,.22);
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .sub { margin-top: 3px; font-size: 12px; color: var(--muted); }
    .view-switch {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      background: #eef5ff;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .view-switch button {
      border: 0;
      border-radius: 999px;
      padding: 8px 11px;
      color: var(--muted);
      background: transparent;
      font-weight: 800;
      font-size: 13px;
    }
    .view-switch button.active {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      box-shadow: 0 8px 18px rgba(23,92,255,.20);
    }

    .phase {
      flex: 1;
      width: 100%;
      height: calc(100vh - 70px);
      min-height: 0;
      margin: 0;
      padding: 16px;
      overflow: hidden;
    }

    /* Phase 1 */
    .phase1-grid {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 24px;
      align-items: stretch;
      height: 100%;
      min-height: 0;
    }
    .panel {
      border: 1px solid rgba(219,231,246,.9);
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: 24px;
    }
    .control-panel {
      padding: 24px;
      position: static;
      align-self: stretch;
      height: 100%;
      min-height: 0;
      overflow: auto;
    }
    .section-label {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue);
      font-weight: 900;
      margin-bottom: 8px;
    }
    .control-panel h2, .idea-card h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.03em;
    }
    .hint {
      margin: 8px 0 18px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }
    label {
      display: block;
      font-weight: 900;
      margin: 14px 0 8px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      padding: 12px 13px;
      outline: none;
    }
    textarea { min-height: 86px; resize: vertical; line-height: 1.55; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,92,255,.10);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 2px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .primary {
      width: 100%;
      margin-top: 18px;
      border: 0;
      color: white;
      border-radius: 16px;
      padding: 14px 16px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      box-shadow: 0 16px 28px rgba(23,92,255,.22);
    }
    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 11px 14px;
      color: var(--ink);
      font-weight: 850;
    }
    .timeline {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .step {
      position: relative;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 11px;
      padding: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 13px;
      top: 28px;
      bottom: 0;
      width: 2px;
      background: var(--line);
    }
    .dot {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      background: #e8f0fb;
      color: var(--blue);
      position: relative;
      z-index: 2;
    }
    .step b { display: block; color: var(--ink); margin-bottom: 3px; }
    .step.active .dot {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      box-shadow: 0 8px 18px rgba(23,92,255,.22);
    }
    .step.done .dot { color: white; background: var(--green); }
    .step.done::after { background: rgba(15,159,110,.28); }

    .idea-stage {
      min-height: 0;
      height: 100%;
      padding: 32px;
      display: grid;
      place-items: center;
      overflow: auto;
    }
    .empty-state {
      text-align: center;
      max-width: 760px;
      padding: 54px;
      border: 1px dashed rgba(23,92,255,.28);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.80), rgba(246,249,255,.92));
    }
    .empty-state .big {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .idea-card {
      width: min(980px, 100%);
      border: 1px solid rgba(219,231,246,.96);
      background: rgba(255,255,255,.96);
      border-radius: 30px;
      padding: 32px;
      box-shadow: 0 24px 70px rgba(20,56,110,.16);
      animation: rise .48s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .idea-title {
      font-size: 30px;
      line-height: 1.25;
      letter-spacing: -.04em;
      margin: 10px 0 14px;
    }
    .idea-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: #eef5ff;
      color: var(--blue);
      padding: 7px 11px;
      font-weight: 900;
      font-size: 12px;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
      margin: 18px 0;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--soft);
      padding: 13px;
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .metric b { font-size: 22px; color: var(--ink); }
    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .metric-head span { margin: 0; }
    .info-btn {
      width: 22px;
      height: 22px;
      border: 1px solid rgba(23,92,255,.24);
      border-radius: 999px;
      background: #fff;
      color: var(--blue);
      font-size: 13px;
      font-weight: 950;
      line-height: 1;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }
    .idea-text {
      color: #334155;
      line-height: 1.72;
      margin: 16px 0;
    }
    .idea-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .mini {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: #fff;
    }
    .mini b { display: block; margin-bottom: 8px; }
    .detail-stack {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .detail-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      overflow: hidden;
    }
    .detail-card summary {
      list-style: none;
      padding: 14px 16px;
      font-weight: 950;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, #fff, #f8fbff);
    }
    .detail-card summary::-webkit-details-marker { display: none; }
    .detail-card summary::after {
      content: "展开";
      color: var(--blue);
      font-size: 12px;
      font-weight: 950;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef5ff;
    }
    .detail-card[open] summary::after { content: "收起"; }
    .detail-body {
      padding: 0 16px 16px;
      color: #334155;
      line-height: 1.7;
    }
    .idea-proposal {
      white-space: pre-wrap;
      margin: 10px 0 16px;
      padding: 14px 16px;
      border: 1px solid rgba(23,92,255,.14);
      border-radius: 14px;
      background: #f8fbff;
      color: #1f2f46;
      line-height: 1.78;
    }
    .link-list a {
      color: var(--blue);
      font-weight: 850;
      text-decoration: none;
    }
    .link-list a:hover { text-decoration: underline; }
    .translate-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 12px 0 0;
    }
    .translate-btn {
      border: 1px solid rgba(23,92,255,.22);
      color: var(--blue);
      background: #eef5ff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 950;
    }
    .translation-box {
      margin-top: 10px;
      border: 1px dashed rgba(23,92,255,.30);
      border-radius: 14px;
      padding: 12px;
      background: #f8fbff;
    }
    ul { margin: 8px 0 0; padding-left: 20px; }
    li { margin: 6px 0; line-height: 1.55; }
    .launch-experiment {
      margin-top: 22px;
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      color: #fff;
      font-size: 16px;
      font-weight: 950;
      background: linear-gradient(135deg, #0f9f6e, #0ea5e9 55%, #175cff);
      box-shadow: 0 18px 38px rgba(14,165,233,.24);
      animation: pulseIn .48s ease both;
    }
    @keyframes pulseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Phase 2 chat cockpit */
    .chat-cockpit {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
    }
    .chat-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(246,249,255,.95));
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px 300px 330px auto;
      gap: 12px;
      align-items: end;
    }
    .chat-title b {
      font-size: 18px;
      display: block;
      margin-bottom: 4px;
    }
    .chat-title span { color: var(--muted); font-size: 13px; }
    .chat-header label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .api-key, .api-base { font-family: var(--mono); }
    .chat-scroll {
      overflow: auto;
      padding: 22px;
      background:
        linear-gradient(180deg, rgba(248,251,255,.75), rgba(255,255,255,.8)),
        radial-gradient(circle at 80% 10%, rgba(23,92,255,.08), transparent 26%);
    }
    .msg {
      width: min(980px, 92%);
      margin: 0 0 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: rise .25s ease both;
    }
    .msg.user { margin-left: auto; flex-direction: row-reverse; }
    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-weight: 950;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
    }
    .msg.user .avatar { background: linear-gradient(135deg, var(--green), #14b8a6); }
    .bubble {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 15px;
      background: #fff;
      line-height: 1.65;
      box-shadow: 0 10px 24px rgba(20,56,110,.06);
    }
    .msg.user .bubble {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      border-color: transparent;
    }
    .bubble h3 { margin: 0 0 8px; font-size: 16px; }
    .bubble table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
      overflow: hidden;
      border-radius: 12px;
    }
    .bubble th, .bubble td {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
    }
    .bubble th { background: #eef5ff; }
    pre {
      margin: 10px 0 0;
      padding: 12px;
      border-radius: 14px;
      background: #0f172a;
      color: #e5f0ff;
      overflow: auto;
      max-height: 260px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .quickbar {
      padding: 12px 18px 0;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }
    .aris-panel {
      padding: 14px 18px 0;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      display: grid;
      grid-template-columns: minmax(240px, 1.25fr) minmax(240px, 1.25fr) 190px auto;
      gap: 12px;
      align-items: end;
    }
    .aris-panel label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .aris-panel input, .aris-panel select { font-family: var(--mono); }
    .agent-start {
      border: 0;
      border-radius: 16px;
      min-height: 48px;
      padding: 0 18px;
      color: #fff;
      font-weight: 950;
      white-space: nowrap;
      background: linear-gradient(135deg, #0f9f6e, #0ea5e9 55%, #175cff);
      box-shadow: 0 14px 30px rgba(14,165,233,.22);
    }
    .quickbar button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 8px 12px;
      color: var(--ink);
      font-weight: 850;
      font-size: 13px;
    }
    .composer {
      padding: 12px 18px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      background: rgba(255,255,255,.94);
    }
    .composer textarea {
      min-height: 54px;
      max-height: 130px;
      resize: vertical;
    }
    .send-btn {
      border: 0;
      align-self: stretch;
      border-radius: 16px;
      padding: 0 20px;
      color: white;
      font-weight: 950;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
    }
    .small-danger {
      border-color: rgba(220,38,38,.22) !important;
      color: var(--red) !important;
    }
    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(15,159,110,.10);
    }

    @media (max-width: 980px) {
      .app-shell { width: 100vw; height: 100vh; min-height: 100vh; }
      .top-nav { height: auto; min-height: 70px; padding: 14px; align-items: flex-start; flex-direction: column; }
      .phase { width: 100%; height: calc(100vh - 132px); padding: 12px; }
      .phase1-grid { grid-template-columns: 1fr; }
      .control-panel { position: static; }
      .idea-stage { min-height: auto; padding: 18px; }
      .score-grid, .idea-columns, .chat-header, .aris-panel { grid-template-columns: 1fr; }
      .chat-cockpit { height: 100%; min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="top-nav">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <h1>AI4S Research Agent</h1>
          <div class="sub">自动化 Idea 挖掘 → 授权实验执行 → 论文草稿</div>
        </div>
      </div>
      <div class="view-switch">
        <button id="phase1Tab" class="active" onclick="showPhase(1)">Phase 1 · Idea 挖掘</button>
        <button id="phase2Tab" onclick="showPhase(2)">Phase 2 · 实验对话舱</button>
      </div>
    </nav>

    <main id="phase1" class="phase">
      <div class="phase1-grid">
        <aside class="panel control-panel">
          <div class="section-label">Input Control Center</div>
          <h2>输入控制中心</h2>
          <p class="hint">输入研究方向、具体想做的任务和任务类型。系统会返回详细 idea 解释、相关 baseline、改进点和实验方案计划。</p>

          <label for="direction">研究方向</label>
          <textarea id="direction">工业异常检测中的可信科研智能体</textarea>

          <label for="taskType">具体想做的任务</label>
          <input id="taskType" list="taskOptions" value="工业异常检测 IAD + Agent" />
          <datalist id="taskOptions">
            <option value="工业异常检测 IAD + Agent"></option>
            <option value="物理属性预测"></option>
            <option value="室内单图 3D 场景生成"></option>
            <option value="药物分子性质预测"></option>
            <option value="蛋白质结构分析"></option>
            <option value="材料发现与性能预测"></option>
          </datalist>

          <label for="researchMode">任务类型</label>
          <select id="researchMode">
            <option value="incremental_improvement">增量改进：在已有 baseline 上加一个最小新模块</option>
            <option value="metric_improvement">指标提升：针对某个指标做方法增强</option>
            <option value="engineering_integration">工程拼接：把多个成熟模块组合成可运行 pipeline</option>
            <option value="evaluation_protocol">评价协议：设计 benchmark、评测指标或负控制</option>
            <option value="system_optimization">系统优化：提升鲁棒性、效率、可解释性或自动化程度</option>
          </select>

          <button class="primary" id="startBtn" onclick="runIdeation()">启动智能体</button>
          <button class="secondary" onclick="resetIdeation()">重置</button>

          <section class="timeline" id="timeline"></section>
        </aside>

        <section class="panel idea-stage">
          <div id="ideaEmpty" class="empty-state">
            <div class="big">🧪</div>
            <h2>等待启动自动化 Idea 挖掘</h2>
            <p class="hint">这里不会再铺满中间过程卡片。运行完成后，只展示被系统筛选出的最优 idea、关键证据、实验准备项和进入实验对话舱的授权入口。</p>
          </div>
          <article id="bestIdeaCard" class="idea-card hidden"></article>
        </section>
      </div>
    </main>

    <main id="phase2" class="phase hidden">
      <section class="chat-cockpit">
        <header class="chat-header">
          <div class="chat-title">
            <b>实验执行对话舱</b>

    function sectionFromReviewedIdea(text, heading) {
      const src = String(text || "");
      const start = src.indexOf(heading + ":");
      if (start < 0) return "";
      const rest = src.slice(start + heading.length + 1).trim();
      const markers = [
        "\n\nMotivation or baseline weakness:",
        "\n\nMechanism or approach:",
        "\n\nExperiment and implementation plan:",
        "\n\nEvidence paper IDs:",
        "\n\nRisks, controls, or fallback:"
      ];
      let end = rest.length;
      for (const marker of markers) {
        const idx = rest.indexOf(marker);
        if (idx >= 0) end = Math.min(end, idx);
      }
      return rest.slice(0, end).trim();
    }

    async function pollWorkflowJob(jobId, maxPolls = 120) {
      for (let i = 0; i < maxPolls; i++) {
        const res = await fetch(`/api/live_workflow/status?job_id=${encodeURIComponent(jobId)}`);
        const data = await res.json();
        const log = data.log_tail || "";
        if (log.includes("[1/6]")) renderTimeline(0, -1);
        if (log.includes("[2/6]")) renderTimeline(1, 0);
        if (log.includes("[3/6]")) renderTimeline(2, 1);
        if (log.includes("[4/6]")) renderTimeline(3, 2);
        if (log.includes("[5/6]")) renderTimeline(6, 5);
        if (log.includes("[6/6]")) renderTimeline(-1, steps.length - 1);
        if (data.status === "finished") return data.result;
        if (data.status === "failed") {
          throw new Error((data.log_tail || "workflow backend failed").slice(-1600));
        }
        await sleep(800);
      }
      throw new Error("workflow backend timeout");
    }

    function modeLabel(value) {

        engineering_integration: "工程拼接",

      };

    async function runWorkflowBackend(task, direction, researchMode) {
      const payload = {
        task_key: taskKeyFromInput(task, direction),
        task_type: task,
        task_mode: researchMode,
        research_direction: direction,
        authorize_llm: false,
        approval_note: ""
      };
      const res = await fetch("/api/live_workflow/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "failed to start live workflow backend");
      return pollWorkflowJob(data.job_id);
    }

    function inferBridgeWorkspace() {
      const taskType = $("taskType").value || "";
      const direction = $("direction").value || "";
      const taskName = currentIdea && currentIdea.taskName ? currentIdea.taskName : taskType;
      const lower = `${taskName} ${taskType} ${direction}`.toLowerCase();
      if (lower.includes("iad") || taskName.includes("异常") || taskType.includes("异常") || direction.includes("异常")) {
        return "outputs/auto_claude_execution_bridge_v1/iad_agent";
      }
      if (taskName.includes("室内") || taskType.includes("室内") || direction.includes("室内") || lower.includes("indoor") || lower.includes("3d")) {
        return "outputs/auto_claude_execution_bridge_v1/indoor3d_scene";
      }
      if (taskName.includes("物理") || taskType.includes("物理") || direction.includes("物理") || lower.includes("physical") || lower.includes("material")) {
        return "outputs/auto_claude_execution_bridge_v1/physical_property";
      }
      return "outputs/auto_claude_execution_bridge_v1/custom_task";
    }

    async function authorizeArisAction(actionId) {
      const action = pendingArisActions[actionId];
      if (!action) return;
      delete pendingArisActions[actionId];
      addMessage("user", `授权执行：${esc(action.label || action.type || "实验动作")}`);
      $("chatStatus").textContent = "授权执行中";
      try {
        const payload = await callArisChat("__AUTHORIZE__", action);
        $("chatStatus").textContent = payload.ok ? "执行返回" : "执行失败";
        addMessage("agent", renderAgentReply(payload));

        $("chatStatus").textContent = "连接失败";
        addMessage("agent", `<h3>实验代理授权执行失败</h3><pre>${esc(String(err))}</pre>`);
      }
    }

          <h3>无法连接实验准备接口</h3>
          请确认页面由 start_demo_server.py 启动，而不是直接双击 HTML。<pre>python 03_demo_video/demo_assets/start_demo_server.py --port 8902</pre>
          ${esc(String(err))}
        `);
      }
    }

    async function runAuthorizedExperiment(model, apiBaseUrl) {
      const taskType = $("taskType").value;
      const direction = $("direction").value;
      const taskName = currentIdea && currentIdea.taskName ? currentIdea.taskName : taskType;
      const lower = `${taskName} ${taskType} ${direction}`.toLowerCase();
      const isIad = lower.includes("iad") || taskName.includes("异常");
      const bridgeWorkspace = isIad
        ? "outputs/auto_claude_execution_bridge_v1/iad_agent"
        : (taskName.includes("室内") || lower.includes("indoor") || lower.includes("3d"))
          ? "outputs/auto_claude_execution_bridge_v1/indoor3d_scene"
          : lower.includes("physical") || lower.includes("material") || taskName.includes("物理")
            ? "outputs/auto_claude_execution_bridge_v1/physical_property"
            : "outputs/auto_claude_execution_bridge_v1/<custom_task>";

      addMessage("agent", `
        正在准备实验执行入口...<pre>model=${esc(model)}
base_url=${esc(apiBaseUrl)}
task=${esc(taskName)}
workspace=${esc(bridgeWorkspace)}
entry=/experiment-bridge refine-logs/EXPERIMENT_PLAN.md</pre>
      `);

      if (!isIad) {
        $("chatStatus").textContent = "实验工作区已准备";
        addMessage("agent", `
          <h3>等待进入对话式实验执行</h3>
          该任务已转成实验工作区。下一步应打开对应目录下的：
          <pre>${esc(bridgeWorkspace)}/AUTHORIZED_CLAUDE_PROMPT.md</pre>
          然后在实验对话中确认数据集路径、API Key 和是否启动实验。Demo 不会伪造未运行结果。
        `);
        return;
      }

      addMessage("agent", `IAD 任务还可调用本地 scaffold executor 做轻量真实运行演示。`);
      try {
        const res = await fetch("/api/execution/authorize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            task_type: taskType,
            research_direction: direction,
            approval_note: "用户在网页端授权进入实验对话舱；IAD 任务同步运行本地 scaffold executor。",
            llm_provider: model.includes("claude") ? "claude" : "other",
            llm_model: model,
            llm_base_url: apiBaseUrl,
            api_key_present: hasApiKey(),
            dataset_path: "Datasets/01_IAD/mvtec_anomaly_detection/mvtec_anomaly_detection",
            categories: ["bottle", "cable", "capsule"]
          })
        });
        const payload = await res.json();
        if (!payload.executed) {
          $("chatStatus").textContent = "runner 待接入";
          addMessage("agent", `<h3>实验 runner 待接入</h3>${esc(payload.message || "")}<br>${esc(payload.next_step || "")}`);
          return;
        }
        $("chatStatus").textContent = payload.ok ? "实验完成" : "执行失败";
        const metrics = payload.summary && payload.summary.metrics ? payload.summary.metrics : {};
        addMessage("agent", `
          <h3>实验执行返回</h3>
          <table>
            <tr><th>字段</th><th>值</th></tr>
            <tr><td>returncode</td><td>${esc(payload.returncode)}</td></tr>
            <tr><td>run_dir</td><td>${esc(payload.run_dir || "")}</td></tr>
            <tr><td>status</td><td>${esc(payload.summary ? payload.summary.status : "")}</td></tr>
            <tr><td>llm_model</td><td>${esc(payload.llm_model || model)}</td></tr>
            <tr><td>llm_base_url</td><td>${esc(payload.llm_base_url || apiBaseUrl)}</td></tr>
            <tr><td>api_key_present</td><td>${esc(payload.api_key_present ? "true" : "false")}</td></tr>
          </table>
          <pre>${esc(JSON.stringify(metrics, null, 2))}</pre>
          <details><summary>executor stdout</summary><pre>${esc(payload.stdout || "")}</pre></details>
        `);
      } catch (err) {
        $("chatStatus").textContent = "连接失败";
        addMessage("agent", `
          <h3>无法连接本地执行 API</h3>
          请确认页面由 start_demo_server.py 启动，而不是直接双击 HTML。<pre>python 03_demo_video/demo_assets/start_demo_server.py --port 8899</pre>
          ${esc(String(err))}
        `);
      }
    }

    renderTimeline();
    loadDemoConfig();
    bindChatEnterToSend();
  </script>
</body>
</html>
