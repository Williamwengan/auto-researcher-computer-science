# GPT-only judge configuration.
# Use this when the current Estelle key can only run GPT models reliably.

api:
  mode: codex
  base_url: https://estellecode.com/v1
  env_key: ESTELLE_API_KEY
  timeout_seconds: 180
  temperature: 0.1
  max_tokens: 4096

judges:
  - name: gpt_5_5
    provider: estelle
    model: gpt-5.5
    backend: codex
    enabled: true

rubric_dimensions:
  - novelty
  - feasibility
  - expected_effectiveness
  - experimental_rigor
  - baseline_grounding
  - mechanism_specificity
  - implementation_readiness
  - overall

agreement_thresholds:
  consistent_std_max: 0.8
  review_needed_std_max: 1.5
