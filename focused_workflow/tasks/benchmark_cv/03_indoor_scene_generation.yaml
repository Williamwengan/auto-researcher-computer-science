project_name: focused_research_ideation_benchmark_cv_03

domain: computer_vision

focus_area: single-image 3D indoor scene generation and reconstruction

research_goal: >
  Generate research ideas for generating a complete 3D indoor scene from a single RGB image. The workflow should infer room layout, object instances, approximate 3D geometry, spatial relations, occluded regions, materials or textures, and a renderable scene representation while emphasizing geometric consistency, physical plausibility, uncertainty, and downstream usability.

input:
  type: single_rgb_indoor_scene_image
  required_information:
    - single_rgb_image
    - camera_intrinsics_if_available
    - visible_objects
    - room_layout_cues
    - occlusion_and_depth_cues

output:
  unit: scene_level
  format: renderable_3d_scene_or_scene_graph
  required_fields:
    - estimated_room_layout
    - object_instances
    - object_3d_positions
    - object_geometry_or_proxy_meshes
    - spatial_relations
    - occluded_region_hypotheses
    - materials_or_textures
    - render_or_preview
    - confidence_or_uncertainty
    - failure_warning

task_types:
  - generative_modeling
  - single_image_3d_generation
  - geometry_consistency
  - metric_improvement
  - benchmark_construction

candidate_baselines:
  single_image_to_3d_scene:
    - Text2Room
    - SceneScape
    - WonderJourney
    - Indoor_NeRF_prior_methods
    - layout_estimation_baselines
    - image_to_3d_generation_baselines
  reconstruction_and_depth:
    - monocular_depth_estimation
    - DUSt3R
    - MASt3R
    - 3D Gaussian Splatting
    - NeRF
  datasets:
    - 3D-FRONT
    - 3D-FUTURE
    - Matterport3D
    - ScanNet
    - Structured3D
    - Hypersim
  evaluation_tools:
    - CLIP
    - object_detector
    - scene_graph_evaluator
    - physics_or_collision_checker

metrics:
  geometry_quality:
    - depth_error
    - layout_iou
    - object_3d_iou
    - chamfer_distance
    - collision_rate
  scene_consistency:
    - support_relation_accuracy
    - object_relation_accuracy
    - out_of_room_rate
    - occlusion_consistency
  image_alignment:
    - visible_object_recall
    - novel_view_consistency
    - image_reconstruction_lpips
    - object_count_accuracy
  uncertainty:
    - confidence_calibration
    - ambiguity_detection
    - failure_detection_auc
  downstream:
    - navigation_success_rate
    - embodied_task_success_rate

constraints:
  compute:
    - prefer_pretrained_depth_reconstruction_and_generation_models
    - allow_lightweight_scene_graph_or_layout_modules
    - avoid_training_large_3d_generative_models_from_scratch
  data:
    - single_image_3d_scene_generation_is_ambiguous
    - hidden_regions_require_uncertain_hypotheses
    - automatic_evaluation_of_scene_plausibility_is_hard
  output_quality:
    - ideas_must_include_single_image_to_3d_baselines
    - ideas_must_include_geometry_and_scene_consistency_metrics
    - ideas_must_include_uncertainty_for_occluded_regions
    - ideas_must_include_failure_cases

idea_generation_requirements:
  number_of_ideas: 3
  each_idea_must_include:
    - title
    - task_type
    - direct_baselines
    - transfer_baselines
    - borrowed_components
    - new_component
    - why_it_may_work
    - datasets
    - metrics
    - ablations
    - risks
    - failure_criteria
    - minimal_new_module
    - mvp_artifacts
    - implementation_plan
