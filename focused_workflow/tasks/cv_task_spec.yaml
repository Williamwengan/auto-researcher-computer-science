domain: computer_vision

focus_area: physical property prediction from 2D indoor scenes

research_direction: >
  Predict physical properties of objects in 2D indoor scene images using
  vision-language models and object-level visual understanding. The system
  should be plug-and-play: given one 2D indoor scene image, detect or segment
  objects, recognize object/material cues, and output physical properties for
  each object that can support embodied AI, simulation, manipulation, and
  physical reasoning.

task: >
  Given a single RGB image of an indoor scene, output a structured list of all
  visible objects and estimate each object's material-related physical
  properties, including density, Young's modulus, Poisson's ratio, hardness,
  friction coefficient, and optional uncertainty intervals.

task_type:
  - metric_improvement
  - object_level_prediction
  - vlm_finetuning
  - dataset_construction
  - multi_modal_reasoning
  - benchmark_construction
  - uncertainty_calibration
  - engineering_stitching

input:
  image_type: single 2D RGB indoor scene image
  optional_inputs:
    - object masks from segmentation models
    - object bounding boxes from open-vocabulary detectors
    - object crops
    - text prompts or scene captions
    - material labels if available
  not_required:
    - direct 3D mesh input at inference time
    - physical interaction with the object
    - large-scale pretraining from scratch

output:
  object_level_schema:
    - object_id
    - object_name
    - mask_or_bbox
    - visible_material_guess
    - density
    - youngs_modulus
    - poisson_ratio
    - hardness
    - friction_coefficient
    - property_unit
    - confidence_or_uncertainty
    - evidence_cues
  downstream_usage:
    - embodied_ai
    - robotic_manipulation
    - indoor_scene_physics_reasoning
    - simulation_parameter_initialization

candidate_baseline_families:
  perception:
    - GroundingDINO
    - SAM_or_SAM2
    - Mask2Former
    - Mask_R_CNN
    - open_vocabulary_detection_models
  vision_language_models:
    - CLIP
    - BLIP2
    - LLaVA
    - Qwen_VL
    - GPT4V_style_VLMs
  physical_or_material_reasoning:
    - material_recognition_models
    - object_attribute_prediction_models
    - 3D_dataset_based_material_property_mapping
    - physical_commonsense_reasoning_methods
  datasets_or_sources:
    - ObjectFolder_or_ObjectFolder2_0
    - indoor_scene_datasets_with_object_annotations
    - material_property_tables
    - synthetic_rendered_2D_views_from_3D_objects

constraints:
  compute: single_gpu_or_cpu_demo
  time: 2_weeks_for_mvp
  no_large_pretraining: true
  preferred_model_size: lightweight_or_2B_to_7B_VLM
  inference_setting: single_image_zero_or_few_shot_plus_lightweight_finetuning
  data_source:
    - 2D indoor scene images
    - object masks_or_bounding_boxes
    - object crops
    - material labels_or_material_descriptions
    - physical_property_tables
    - synthetic_2D_views_rendered_from_3D_object_datasets
  practical_limitations:
    - physical properties are often material-dependent and not directly visible
    - one object may contain multiple materials
    - 2D image lacks hidden geometry and internal composition
    - numeric property labels may be noisy or interval-valued

non_goals:
  - do_not_train_a_large_VLM_from_scratch
  - do_not_require_robot_physical_interaction
  - do_not_require_3D_mesh_at_inference_time
  - do_not_claim_exact_physical_measurement_from_image_only
  - do_not_only_output_material_class_without_physical_properties

target_metrics:
  object_detection_or_segmentation:
    - mAP
    - mask_IoU
    - object_recall
  material_or_category_classification:
    - Accuracy
    - Balanced_Accuracy
    - Macro_F1
    - Top_3_Accuracy
  physical_property_regression:
    - MAE
    - RMSE
    - MAPE
    - log_MAE
    - relative_error
  interval_or_uncertainty_prediction:
    - calibration_error
    - prediction_interval_coverage
    - negative_log_likelihood
  end_to_end_object_property_prediction:
    - object_level_property_accuracy
    - material_conditioned_property_error
    - scene_level_property_completion_rate
  robustness:
    - cross_dataset_generalization
    - domain_shift_performance
    - performance_under_occlusion
    - performance_under_lighting_change

expected_research_outputs:
  - baseline_cards
  - focused_ideas
  - experiment_plan
  - evaluation_metrics
  - dataset_construction_plan
  - ablation_study_plan
  - uncertainty_modeling_plan
  - failure_cases_and_risk_analysis

idea_generation_requirements:
  each_idea_must_include:
    - direct_baselines
    - transfer_baselines
    - physical_property_label_source
    - object_segmentation_or_detection_strategy
    - VLM_or_multimodal_reasoning_strategy
    - predicted_properties
    - datasets
    - metrics
    - ablations
    - failure_criteria
    - minimal_new_module
    - mvp_artifacts
    - risks
  preferred_idea_style:
    - baseline_grounded
    - fine_grained
    - implementation_ready
    - suitable_for_two_week_MVP
    - honest_about_image_only_physical_property_uncertainty
