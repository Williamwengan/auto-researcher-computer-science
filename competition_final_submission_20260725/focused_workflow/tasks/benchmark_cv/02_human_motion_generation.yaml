project_name: focused_research_ideation_benchmark_cv_02

domain: computer_vision

focus_area: human motion generation from text, scene, pose, or action conditions

research_goal: >
  Generate research ideas for controllable and physically plausible human motion
  generation. The workflow should focus on methods that generate human motion
  sequences from text prompts, action labels, sparse poses, scene constraints, or
  interaction goals, while improving realism, controllability, diversity, and
  physical consistency.

input:
  type: text_action_pose_scene_or_multimodal_condition
  required_information:
    - text_prompt_or_action_label
    - optional_initial_pose_or_keyframes
    - optional_scene_geometry_or_floor_contact
    - optional_interaction_object
    - optional_style_or_speed_control

output:
  unit: sequence_level
  format: motion_sequence_or_smpl_parameters
  required_fields:
    - motion_sequence
    - skeleton_or_smpl_parameters
    - condition_alignment_score
    - physical_plausibility_score
    - diversity_score
    - failure_warning

task_types:
  - generative_modeling
  - metric_improvement
  - controllability_improvement
  - physical_consistency
  - engineering_integration

candidate_baselines:
  motion_generation:
    - MotionDiffuse
    - MDM
    - T2M-GPT
    - MotionGPT
    - PriorMDM
    - MLD
  human_body_models:
    - SMPL
    - SMPL-X
    - HumanML3D
    - KIT-ML
  scene_conditioned_motion:
    - HUMANISE
    - PROX
    - SAMP
    - GTA-IM
  multimodal_models:
    - CLIP
    - T5
    - LLaVA
    - Qwen-VL

metrics:
  motion_quality:
    - fid
    - diversity
    - multimodality
    - foot_sliding_rate
    - penetration_rate
  condition_alignment:
    - r_precision
    - text_motion_retrieval_score
    - action_accuracy
    - scene_goal_success_rate
  physical_consistency:
    - ground_contact_error
    - collision_rate
    - joint_limit_violation
  user_control:
    - keyframe_error
    - trajectory_error
    - edit_consistency

constraints:
  compute:
    - prefer_finetuning_or_adapters_over_training_from_scratch
    - allow_cached_motion_features
    - avoid_large_scale_rendering_if_not_needed
  data:
    - motion_datasets_may_have_limited_scene_annotations
    - text_descriptions_may_be_noisy_or_ambiguous
  output_quality:
    - ideas_must_include_baselines
    - ideas_must_include_motion_metrics
    - ideas_must_include_physical_failure_modes
    - ideas_must_include_experiment_plan

idea_generation_requirements:
  number_of_ideas: 3
  each_idea_must_include:
    - title
    - task_type
    - direct_baselines
    - transfer_baselines
    - borrowed_components
    - new_component
    - why_it_may_work
    - datasets
    - metrics
    - ablations
    - risks
    - failure_criteria
    - minimal_new_module
    - mvp_artifacts
    - implementation_plan
